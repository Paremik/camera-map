name: Refresh public ITS catalogue
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-its-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm refresh:its
      - run: pnpm typecheck
      - run: pnpm test
      - name: Create reviewable update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Official catalogue is unchanged."
            exit 0
          fi
          branch="automation/refresh-its"
          expected=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/its-cameras.json data/sources/its-opole-latest.json
          git commit -m "Refresh public ITS catalogue"
          git push --force-with-lease="refs/heads/$branch:$expected" origin "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" --title "Refresh public ITS catalogue" --body "Automated weekly refresh from the official public ITS Opole endpoint. The adapter validation and project tests passed. Review source changes before merging."
